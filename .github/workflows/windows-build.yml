name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build and verify Windows executable
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: UzluksizBCMS-Windows-x64
          path: |
            dist/UzluksizBCMS.exe
            release/windows-test-results.xml
            release/win32-package-verification.json
            release/packaged-smoke-*/result.json
          if-no-files-found: error
