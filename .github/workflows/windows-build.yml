name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build and verify Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          try {
            & ./build.ps1 *>&1 | Tee-Object -FilePath release/ci-build.log
            if ($LASTEXITCODE -ne 0) { throw "Build returned $LASTEXITCODE" }
          } catch {
            $_ | Out-String | Add-Content release/ci-build.log
            '### Windows build failed' | Add-Content $env:GITHUB_STEP_SUMMARY
            '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content release/ci-build.log -Tail 65 | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 1
          }
      - name: Publish failure diagnostic
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path release/ci-build.log) {
            $message = (Get-Content release/ci-build.log -Tail 50) -join "`n"
          } else {
            $message = 'No build transcript was created; failure preceded application build.'
          }
          $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::error title=Windows build diagnostics::$message"
      - name: Record successful packaged verification
        if: success()
        shell: pwsh
        run: |
          '### Windows EXE built and automated checks passed' | Add-Content $env:GITHUB_STEP_SUMMARY
          'Download UzluksizBCMS-Windows-x64 from this run''s Artifacts section.' | Add-Content $env:GITHUB_STEP_SUMMARY
          '```json' | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content release/win32-package-verification.json | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: UzluksizBCMS-Windows-x64
          path: |
            dist/UzluksizBCMS.exe
            release/windows-test-results.xml
            release/win32-package-verification.json
            release/packaged-smoke-*/result.json
          if-no-files-found: error
  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UzluksizBCMS-Windows-x64
          path: package
      - name: Publish tested Windows build for direct download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: windows-mvp-${{ github.run_number }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f package/dist/UzluksizBCMS.exe
          cat > release-notes.md <<'NOTES'
          Windows 10/11 x64 one-file PyInstaller build of UzluksizBCMS Desktop 1.0.0 MVP.

          Download UzluksizBCMS.exe below. End users do not need Python.

          This build passed the automated Windows test suite and a packaged Qt/SQLite/authentication/restart/backup/PDF/CSV smoke test. The GUI check uses Qt's offscreen platform; native interactive Windows and display-scaling sign-off remains a separate manual check. See docs/WINDOWS_RELEASE.md.

          The application is unsigned. No database encryption, ISO certification or DGU registration is claimed.
          NOTES
          gh release create "$RELEASE_TAG" \
            package/dist/UzluksizBCMS.exe \
            package/release/win32-package-verification.json \
            package/release/windows-test-results.xml \
            --repo "$GH_REPO" --target "$RELEASE_COMMIT" --prerelease \
            --title 'UzluksizBCMS Desktop 1.0.0 — Windows MVP' \
            --notes-file release-notes.md
